# Generated by `brew tap-new` (Homebrew 7.0), plus a label trigger.
# Publishes a pull request's bottles (built by tests.yml): uploads them to a
# GitHub Release of this tap (tag `<formula>-<version>`), adds the
# `bottle do` block, and pushes the PR's commits plus the bottle commit to
# main, which closes the PR. Use it instead of the Merge button for formula
# PRs: add the `pr-pull` label to the PR, or run this workflow by hand with
# the PR number. Only needs the built-in GITHUB_TOKEN.
name: brew pr-pull

on:
  pull_request:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    # Labels need write access; forks never get a writable token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'pr-pull' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      # On the label trigger the checkout is the PR's merge ref; pr-pull
      # applies the PR on top of main.
      - name: Check out main
        run: |
          cd "$(brew --repository "$GITHUB_REPOSITORY")"
          git fetch origin main
          git checkout -B main origin/main

      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.pull_request.number }}
        run: |
          # pr-pull starts from $GITHUB_SHA. On the label trigger that's the
          # PR's merge commit, which already contains the formula change, so
          # pr-pull would see nothing to bottle; start from main instead.
          GITHUB_SHA="$(git -C "$(brew --repository "$GITHUB_REPOSITORY")" rev-parse HEAD)"
          export GITHUB_SHA
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" \
              "$PULL_REQUEST"
          else
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          branch: main
